name: Dooray Morning Bot

on:
  schedule:
    # 한국 시간 오전 8시 45분으로 설정 (세계 표준시 23시 45분)
    # 깃허브가 게으름을 피워도 오전 9시~9시 5분 사이에는 무조건 도착하게 만듭니다.
    - cron: '45 23 * * *'
  workflow_dispatch:

jobs:
  send-message:
    runs-on: ubuntu-latest
    steps:
      - name: Send Morning Greeting to Dooray
        run: |
          curl -H "Content-Type: application/json" \
          -X POST \
          -d '{"text": "재국님, 본사신가요?"}' \
          "https://gravity.dooray.com/services/2592578758829202186/4326990432273056233/WYgU-6nIR_SI7qrotizmwQ"
